<!DOCTYPE html>
<html lang="en">
<head>
  <title>500 Server Error // Tarkov DB</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#06080a">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    @font-face {
      font-family: 'bender';
      font-display: swap;
      font-style: normal;
      font-weight: 400;
      src: local('Bender Regular'), url('https://tarkov.dev/fonts/bender.woff2') format('woff2');
    }
    @font-face {
      font-family: 'bender';
      font-display: swap;
      font-style: normal;
      font-weight: 700;
      src: local('Bender Bold'), url('https://tarkov.dev/fonts/bender-bold.woff2') format('woff2');
    }
    :root {
      --bg-dark: #06080a;
      --bg-panel: #0d1117;
      --text: #e8e4d8;
      --text-bright: #f6f1e7;
      --text-muted: #9a9488;
      --accent: #c9a84c;
      --accent-hover: #dcc06a;
      --border: #262b33;
      --danger: #b8433a;
      --status: var(--danger);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem 1rem;
      text-align: center;
      background: var(--bg-dark);
      color: var(--text);
      font-family: 'bender', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .brand {
      margin: 0;
      font-size: 0.875rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .brand b { color: var(--accent); margin-right: 0.45em; }
    .status {
      margin: 0;
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--status);
      font-variant-numeric: tabular-nums;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-bright);
    }
    p {
      margin: 0;
      max-width: 34rem;
      font-size: 0.9375rem;
      color: var(--text-muted);
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
    }
    a:hover { border-color: var(--accent); color: var(--accent); }
    a.primary { background: var(--accent); border-color: var(--accent); color: var(--bg-dark); }
    a.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--bg-dark); }
  </style>
</head>
<body>
  <p class="brand"><b>TARKOV</b>DB</p>
  <p class="status">500</p>
  <h1>Something broke on our side</h1>
  <p>This one is not your fault. Try again in a moment; if it keeps happening, send a note through the feedback form on the items page.</p>
  <nav>
    <a class="primary" href="/items">Browse items</a>
    <a href="/tasks">Quests</a>
  </nav>
</body>
</html>
