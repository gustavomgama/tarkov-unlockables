<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <title>404 // Tarkov DB</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-panel: #12161c;
      --text: #e0e0e0;
      --text-bright: #ffffff;
      --text-muted: #888888;
      --accent: #d2af78;
      --accent-hover: #e6c58c;
      --border: #333333;
    }
    html { background-color: var(--bg-dark); }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      text-align: center;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
  </style>
</head>
<body>
  <h1 style="font-size: 5rem; font-weight: 700; color: var(--accent); margin-bottom: 0.5rem;">404</h1>
  <p style="font-size: 1.25rem; color: var(--text-bright); margin-bottom: 0.5rem;">Page not found</p>
  <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
  <a href="/" style="padding: 0.5rem 1rem; background: var(--accent); color: var(--bg-dark); border-radius: 0.25rem; font-weight: 700;">Back to Items</a>
</body>
</html>
