# PostgreSQL Configuration

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

  # Connection timeouts
  prepared_statements: false
  connect_timeout: 5
  checkout_timeout: 5
  idle_timeout: 300
  reaping_frequency: 60

  # Statement timeouts via SET — development/test only. Neon pooled
  # connections (PgBouncer transaction mode) reject session SETs, and the
  # memory tuning below was sized for a 1GB VPS, not Neon, so production
  # stays minimal: pool + connect timeouts + prepared_statements off.
  variables:
    statement_timeout: 5000
    idle_in_transaction_session_timeout: 10000

development:
  <<: *default
  database: tarkov_db_development
  prepared_statements: true

test:
  <<: *default
  database: tarkov_db_test
  prepared_statements: true

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  prepared_statements: false
  variables: {}
