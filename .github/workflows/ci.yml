name: CI

# Contract: every job below delegates to lib/tasks/ci.rake — the single
# source of truth shared with local `bin/ci` (config/ci.rb). Do NOT inline
# tool commands here; change the rake task and all three stay in sync.
#
# Deploy parity (Render + Neon): DB jobs run postgres:18 (Neon production
# major) with a DIRECT, non-pooled DATABASE_URL exactly like render.yaml
# requires, and the docker job rehearses the Render deploy — build the
# production Dockerfile, run db:migrate (preDeployCommand), boot Puma with
# Render's dockerCommand + env, and poll /up (healthCheckPath).

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Security scanning (rake ci:security) ─────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Brakeman + bundler-audit
        run: bundle exec rake ci:security

  # ── Linting (rake ci:lint + ci:fasterer) ─────────────────────────────
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: RuboCop
        run: bundle exec rake ci:lint

      - name: Fasterer (performance idioms)
        run: bundle exec rake ci:fasterer

  # ── Development boot check (rake ci:development) ─────────────────────
  development:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tarkov_db_development
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tarkov_db_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Boot check (db:prepare, routes, bullet + goldiloader)
        run: bundle exec rake ci:development

  # ── Tests (rake ci:test) ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tarkov_db_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tarkov_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Test suite
        run: bundle exec rake ci:test

  # ── Coverage gate (rake ci:coverage) ─────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tarkov_db_coverage
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tarkov_db_coverage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Tests with coverage gate
        run: bundle exec rake ci:coverage

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Code quality (rake ci:audit) ─────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Rubycritic (score ≥ 75)
        run: bundle exec rake ci:audit

      - name: Summarize
        if: always()
        run: |
          SCORE=$(python3 -c "import json; d=json.load(open('tmp/rubycritic/report.json')); print(d.get('score','?'))" 2>/dev/null || echo "?")
          echo "## Rubycritic: $SCORE / 100" >> $GITHUB_STEP_SUMMARY

  # ── Deploy rehearsal: build, migrate, boot, health-check ─────────────
  # Mirrors render.yaml: production Dockerfile, db:migrate preDeployCommand,
  # Puma via dockerCommand + Render env, /up healthCheckPath, direct
  # (non-pooled) DATABASE_URL against postgres:18 like Neon production.
  docker:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: production
      PORT: 3001
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      RAILS_LOG_LEVEL: info
      WEB_CONCURRENCY: "1"
      RAILS_MAX_THREADS: "5"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tarkov_db_prod
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tarkov_db_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Throwaway secrets (master.key is never committed)
        run: |
          echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=ci-dummy" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (rake ci:docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tarkov-db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrate (mirrors preDeployCommand)
        run: |
          docker run --rm --network host \
            -e RAILS_ENV -e DATABASE_URL -e SECRET_KEY_BASE -e ADMIN_PASSWORD \
            -e RAILS_LOG_TO_STDOUT \
            tarkov-db:${{ github.sha }} bundle exec rails db:migrate

      - name: Boot with Render's command, poll /up (mirrors healthCheckPath)
        run: |
          docker run -d --name app --network host \
            -e RAILS_ENV -e PORT -e DATABASE_URL -e SECRET_KEY_BASE -e ADMIN_PASSWORD \
            -e RAILS_LOG_TO_STDOUT -e RAILS_SERVE_STATIC_FILES -e RAILS_LOG_LEVEL \
            -e WEB_CONCURRENCY -e RAILS_MAX_THREADS \
            tarkov-db:${{ github.sha }} bundle exec puma -C config/puma.rb
          for i in $(seq 1 24); do
            sleep 5
            curl -sf http://localhost:3001/up && break
          done
          curl -sf http://localhost:3001/up
          docker logs --tail 20 app
          docker stop app

  # ── Merge gate ───────────────────────────────────────────────────────
  gate:
    if: always()
    needs: [security, lint, development, test, coverage, audit, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          FAILED=0
          for result in \
            "security:${{ needs.security.result }}" \
            "lint:${{ needs.lint.result }}" \
            "development:${{ needs.development.result }}" \
            "test:${{ needs.test.result }}" \
            "coverage:${{ needs.coverage.result }}" \
            "audit:${{ needs.audit.result }}" \
            "docker:${{ needs.docker.result }}"; do
            name="${result%%:*}"
            status="${result#*:}"
            if [ "$status" != "success" ]; then
              echo "::error::$name $status"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "Results:"
            echo "  security:    ${{ needs.security.result }}"
            echo "  lint:        ${{ needs.lint.result }}"
            echo "  development: ${{ needs.development.result }}"
            echo "  test:        ${{ needs.test.result }}"
            echo "  coverage:    ${{ needs.coverage.result }}"
            echo "  audit:       ${{ needs.audit.result }}"
            echo "  docker:      ${{ needs.docker.result }}"
            exit 1
          fi
          echo "All checks passed"
