version: 2
updates:
  # Ruby gems (Gemfile / Gemfile.lock)
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps the queue small; a single broken bump is
      # still isolated by the CI pipeline.
      ruby-dependencies:
        patterns: [ "*" ]

  # Tailwind / Vite node packages
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-dependencies:
        patterns: [ "*" ]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: [ "*" ]

  # Base images in Dockerfile / Dockerfile.dev
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns: [ "*" ]
